<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FloodEye · น้ำท่วมจากดาวเทียม</title>
<link rel="icon" href="favicon-64.png" type="image/png">
<meta name="description" content="พื้นที่น้ำท่วมจากดาวเทียม GISTDA รอบสถานีไฟฟ้า กฟน.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f7fa; --panel:#ffffff; --panel2:#eef4f8; --line:#d5e2ea;
  --text:#0f2a3a; --muted:#5a7485; --water:#0a84b8; --sat:#1d4ed8;
  --l0:#1f9d63; --l1:#d9a400; --l2:#ea6a12; --l3:#e03347;
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--water)}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:700;font-size:18px}
.back img{width:40px;display:block}
.back small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.sp{flex:1}
.stamp{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
#map{height:100%;min-height:300px}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lead{font-size:28px;font-weight:700;line-height:1.2;margin:0}
.lead span{font-size:15px;font-weight:500;color:var(--muted);display:block;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.facts div{background:var(--panel2);padding:8px 10px;font-size:12px;color:var(--muted)}
.facts b{display:block;font-size:17px;color:var(--text)}
h2{font-size:15px;margin:18px 0 8px}
.st{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font:inherit;color:inherit;cursor:pointer}
.st:hover{background:var(--panel2)}
.st i{width:10px;height:10px;border-radius:50%}
.st .n{font-weight:600;font-size:14px}
.st .m{font-size:12px;color:var(--muted)}
.st .c{font-size:13px;text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.65}
.warn{background:#fff6e0;border:1px solid #f0d58a;color:#6b4e00;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:12px}
.empty{padding:18px 4px;color:var(--muted);font-size:14px;line-height:1.7}
.legend{position:absolute;z-index:500;left:10px;bottom:22px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.8}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .cell{border-radius:2px;background:rgba(29,78,216,.45);border:1px solid var(--sat)}
.mapwrap{position:relative;min-height:0}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:55vh auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .lead{font-size:24px}
  .back{font-size:16px}
}
</style>
</head>
<body>
<header>
  <a class="back" href="./" title="กลับหน้าหลัก FloodEye"><img src="logo-eye.png" alt="" width="40" height="25"><div>FloodEye<small>น้ำท่วมจากดาวเทียม GISTDA · 7 วันล่าสุด</small></div></a>
  <div class="sp"></div>
  <div class="stamp" id="stamp">กำลังโหลด…</div>
</header>
<main>
  <div class="mapwrap"><div id="map"></div>
    <div class="legend">
      <div><i class="cell"></i>พื้นที่ที่ดาวเทียมพบน้ำ</div>
      <div><i style="background:var(--l3)"></i>น้ำในรัศมี 500 ม.</div>
      <div><i style="background:var(--l2)"></i>น้ำในรัศมี 1 กม.</div>
      <div><i style="background:var(--l1)"></i>น้ำในรัศมี 3 กม.</div>
      <div><i style="background:var(--l0)"></i>ไม่พบน้ำ</div>
    </div>
  </div>
  <aside id="panel"><div class="empty">กำลังโหลดข้อมูล…</div></aside>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9duN7uzwd8LHZuhFj5LBcKSx5k06C-a8",
  authDomain: "motoreye-b8829.firebaseapp.com",
  projectId: "motoreye-b8829",
  storageBucket: "motoreye-b8829.firebasestorage.app",
  messagingSenderId: "1055859740152",
  appId: "1:1055859740152:web:0fc2aa85b098ddaac89a0d"
};
const db = firebase.initializeApp(firebaseConfig, "floodeye").firestore();
const CELL_KM2 = 0.105;           // พื้นที่เฉลี่ยของช่อง H3 ความละเอียด 9
const PV = {"10":"กรุงเทพฯ","11":"สมุทรปราการ","12":"นนทบุรี"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thDate = d => d ? new Date(d.length === 10 ? d + "T12:00:00+07:00" : d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}) : "-";
const thTime = d => d ? new Date(d).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "-";
const lvl = g => !g ? null : g.c500 ? 3 : g.c1k ? 2 : g.c3k ? 1 : 0;
const LV = [{c:"#1f9d63",t:"ไม่พบน้ำ"},{c:"#d9a400",t:"น้ำในรัศมี 3 กม."},{c:"#ea6a12",t:"น้ำในรัศมี 1 กม."},{c:"#e03347",t:"น้ำในรัศมี 500 ม."}];

const map = L.map("map",{zoomControl:false,preferCanvas:true}).setView([13.76,100.6],10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ข้อมูลน้ำท่วม: GISTDA',maxZoom:19}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);
const cellLayer = L.layerGroup().addTo(map), stLayer = L.layerGroup().addTo(map);
const renderer = L.canvas({padding:.5});
let summary = null, stations = [], fitted = false, markers = {};

function drawCells(){
  cellLayer.clearLayers();
  if(!summary?.cells) return;
  for(const p of summary.cells.split(";")){
    const [la, lo] = p.split(",").map(Number); if(!la || !lo) continue;
    L.circle([la,lo],{radius:190,renderer,stroke:false,fillColor:"#1d4ed8",fillOpacity:.45,interactive:false}).addTo(cellLayer);
  }
}
function drawStations(){
  stLayer.clearLayers(); markers = {};
  const pts = [];
  for(const s of stations){
    const l = lvl(s.gistda); const c = l == null ? "#8aa0ae" : LV[l].c;
    const g = s.gistda || {};
    const m = L.circleMarker([s.lat,s.lng],{radius:l >= 2 ? 8 : 6,color:"#fff",weight:1.5,fillColor:c,fillOpacity:1}).addTo(stLayer)
      .bindTooltip(`<b>${esc(s.name)}</b><br>${l == null ? "ยังไม่มีข้อมูลดาวเทียม" : l === 0 ? "ไม่พบน้ำในรัศมี 3 กม." : `น้ำ ${g.c500} ช่องใน 500 ม. · ${g.c1k} ใน 1 กม. · ${g.c3k} ใน 3 กม.`}`);
    markers[s.id] = m; pts.push([s.lat,s.lng]);
  }
  if(!fitted && pts.length){ map.fitBounds(pts,{padding:[30,30]}); fitted = true; }
}
function drawPanel(){
  const P = $("#panel");
  if(!summary){
    P.innerHTML = `<div class="empty"><b>ยังไม่มีข้อมูลดาวเทียม</b><br>เปิด workflow “FloodEye — GISTDA Satellite” ใน n8n แล้วกด Execute workflow 1 ครั้ง ข้อมูลจะขึ้นที่หน้านี้ทันที</div>`;
    $("#stamp").textContent = "ยังไม่มีข้อมูล"; return;
  }
  const hit = stations.filter(s => lvl(s.gistda) > 0).sort((a,b) => (b.gistda.c500-a.gistda.c500) || (b.gistda.c1k-a.gistda.c1k) || (b.gistda.c3k-a.gistda.c3k));
  const km2 = Math.round(summary.total * CELL_KM2 * 10) / 10;
  const bp = summary.byPv || {};
  const failed = summary.requests && summary.errors >= summary.requests;
  $("#stamp").innerHTML = `ภาพดาวเทียมล่าสุด ${thDate(summary.latestAt)}<br>ดึงข้อมูล ${thTime(summary.updatedAt)}`;
  P.innerHTML = `
    ${failed ? `<div class="warn" style="margin:0 0 12px"><b>ดึงข้อมูลจาก GISTDA ไม่สำเร็จ</b><br>${esc(summary.lastErr || "")}<br>ตรวจ credential “GISTDA API” ใน n8n (Header Auth, Name: API-Key)</div>` : ""}
    <p class="lead">${summary.total ? `${hit.length} สถานี มีน้ำท่วมใกล้` : "ไม่พบน้ำท่วม"}
      <span>${summary.total ? `ดาวเทียมพบพื้นที่น้ำประมาณ ${km2.toLocaleString("th-TH")} ตร.กม. ในเขต กฟน.` : "ดาวเทียมไม่พบน้ำท่วมในเขต กฟน. ช่วง 7 วันล่าสุด"}</span></p>
    <div class="facts">
      <div><b>${(bp["10"]||0).toLocaleString("th-TH")}</b>ช่อง · ${PV["10"]}</div>
      <div><b>${(bp["12"]||0).toLocaleString("th-TH")}</b>ช่อง · ${PV["12"]}</div>
      <div><b>${(bp["11"]||0).toLocaleString("th-TH")}</b>ช่อง · ${PV["11"]}</div>
      <div><b>${summary.stationsTotal || stations.length}</b>สถานีที่ตรวจ</div>
    </div>
    ${summary.truncated ? `<div class="note">แสดงบนแผนที่ 50,000 ช่องแรก จากทั้งหมด ${summary.total.toLocaleString("th-TH")} ช่อง</div>` : ""}
    <h2>สถานีที่มีน้ำท่วมในรัศมี 3 กม.</h2>
    ${hit.length ? hit.map(s => { const l = lvl(s.gistda), g = s.gistda; return `
      <button class="st" data-id="${esc(s.id)}"><i style="background:${LV[l].c}"></i>
        <div><div class="n">${esc(s.name)}</div><div class="m">${LV[l].t}${g.nearestKm != null ? `, ใกล้สุด ${g.nearestKm} กม.` : ""}</div></div>
        <div class="c">${g.c500} / ${g.c1k} / ${g.c3k}</div></button>`; }).join("") + `<div class="note" style="margin-top:6px">ตัวเลขขวา คือจำนวนช่องน้ำท่วมในรัศมี 500 ม. / 1 กม. / 3 กม.</div>`
      : `<div class="empty">ไม่มีสถานีที่พบน้ำท่วมในรัศมี 3 กม.</div>`}
    <div class="warn">ดาวเทียมเห็นน้ำท่วมขังพื้นที่กว้างได้ดี แต่อาจไม่เห็นน้ำขังบนถนนในเมืองที่ท่วมเพียงไม่กี่ชั่วโมง ใช้หน้านี้ร่วมกับคะแนนความเสี่ยงในหน้าหลัก <a href="./">FloodEye</a></div>
    <p class="note">ข้อมูล: สำนักงานพัฒนาเทคโนโลยีอวกาศและภูมิสารสนเทศ (GISTDA) ตามนโยบายข้อมูลเปิดภาครัฐ อัปเดตทุก 3 ชั่วโมง</p>`;
  P.querySelectorAll(".st").forEach(b => b.onclick = () => {
    const s = stations.find(x => x.id === b.dataset.id); if(!s) return;
    map.setView([s.lat,s.lng],14); markers[s.id]?.openTooltip();
    if(matchMedia("(max-width:820px)").matches) window.scrollTo({top:0,behavior:"smooth"});
  });
}
function render(){ drawStations(); drawPanel(); }

db.collection("gistda").doc("latest").onSnapshot(d => { summary = d.exists ? d.data() : null; drawCells(); render(); },
  e => { $("#panel").innerHTML = `<div class="empty"><b>อ่านข้อมูลไม่ได้</b><br>${esc(e.message)}<br>ตรวจว่าเพิ่มกฎ Firestore ของ gistda แล้ว</div>`; $("#stamp").textContent = "อ่านข้อมูลไม่ได้"; });
db.collection("flood_stations").onSnapshot(snap => {
  stations = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(s => s.lat != null && s.lng != null).map(s => ({...s, name: s.name || decodeURIComponent(s.id)}));
  render();
}, () => {});
</script>
</body>
</html>
