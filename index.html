<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FloodEye · เฝ้าระวังน้ำท่วมสถานีไฟฟ้า</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f7fa; --panel:#ffffff; --panel2:#eef4f8; --line:#d5e2ea;
  --text:#0f2a3a; --muted:#5a7485; --water:#0a84b8;
  --l0:#1f9d63; --l1:#d9a400; --l2:#ea6a12; --l3:#e03347; --l4:#d4145a; --lx:#1a1a1a;
  --r:14px;
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand svg{width:28px;height:28px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
header .sp{flex:1}
.updated{font-size:12px;color:var(--muted);text-align:right}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--water);color:#fff;border-color:var(--water);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}
#map{position:absolute;inset:0;background:#e8eef2}
.pad{padding:16px;max-width:760px;margin:0 auto}

nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--water)}

/* summary strip on map */
.strip{position:absolute;z-index:500;left:12px;right:12px;top:12px;display:flex;gap:6px;overflow-x:auto}
.chip{cursor:pointer;font-family:inherit;color:var(--text);flex:none;background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(15,42,58,.12);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.chip.off{opacity:.45;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* station list with water gauge */
.row{display:flex;gap:12px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;width:100%;text-align:left}
.gauge{width:18px;border-radius:6px;background:#e6eef3;border:1px solid var(--line);position:relative;overflow:hidden;flex:none;min-height:54px}
.gauge i{position:absolute;left:0;right:0;bottom:0;transition:height .6s ease}
.gauge i::before{content:"";position:absolute;left:-4px;right:-4px;top:-3px;height:6px;border-radius:50%;background:inherit;filter:brightness(1.15)}
.row .body{flex:1;min-width:0}
.row h3{margin:0 0 2px;font-size:16px;font-weight:600}
.row .meta{font-size:13px;color:var(--muted)}
.lvl{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff}
.score{font-size:22px;font-weight:700;align-self:center;min-width:44px;text-align:right}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button.on{border-color:var(--water);color:var(--water)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,42,58,.35);z-index:900;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(15,42,58,.15);max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet-bg.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0;font-size:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv b{display:block;font-size:18px}
.kv span{font-size:12px;color:var(--muted)}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13px}
.seg button.on{border-color:var(--water);background:#e1f1f9;color:#075f86;font-weight:600}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.confirm{border:1px solid var(--l4);background:#fdeaf1;color:#8a0d3b;border-radius:10px;padding:10px;font-size:14px}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* report */
.rep-head{background:linear-gradient(180deg,#dff0f8,#ffffff);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rep-head h2{margin:0;font-size:20px}
.rep-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.rep-grid div{text-align:center;border-radius:10px;padding:8px 2px;background:var(--panel2)}
.rep-grid b{display:block;font-size:22px}
.rep-grid span{font-size:11px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:16px}
.card ul{margin:0;padding-left:18px;line-height:1.8;font-size:14px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;margin-top:12px}
.drop img{max-width:100%;max-height:220px;border-radius:8px;margin-top:10px}
.guide h2{font-size:20px;margin:0 0 6px}
.guide h3{font-size:16px;margin:0 0 8px}
.guide p{font-size:14px;line-height:1.7;margin:0 0 8px}
.gt{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 6px}
.gt th{background:var(--water);color:#fff;text-align:left;font-weight:600;padding:7px 10px}
.gt td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
.gt td:first-child{font-weight:500}
.gt-wrap{overflow-x:auto}
.guide ol,.guide ul{margin:0;padding-left:20px;font-size:14px;line-height:1.8}
.lv-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(15,42,58,.18);padding:8px 10px;font-family:inherit}
.tip{font-size:13px;line-height:1.6;min-width:150px}
.tip b{font-size:14px}
.tip .lvl{margin-right:4px}
.tip-t{color:var(--muted);font-size:12px}
.ltool{display:flex;gap:8px;margin-bottom:10px}
.ltool input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.ltool select{width:auto;background:var(--panel)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px}
@media (max-width:520px){.lgrid{grid-template-columns:1fr}}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 12px;width:100%;text-align:left;min-height:64px}
.srow:hover{box-shadow:0 2px 10px rgba(15,42,58,.08)}
.srow .nm{font-weight:600;font-size:15px;line-height:1.3}
.srow .tp{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.srow .mt{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:3px}
.srow .mt b{color:var(--text);font-weight:600}
.srow .bd{flex:1;min-width:0}
.srow .sc{text-align:right;flex:none;min-width:58px}
.srow .sc b{display:block;font-size:22px;line-height:1;color:var(--c)}
.srow .sc span{font-size:11px;color:var(--c);font-weight:600}
.acc{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#e8eef2;color:var(--text)}
.acc.no{background:#fde2e5;color:#b3182c}
.filters button .n{opacity:.7;margin-left:4px}
.filters .dot{margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f2a3a;color:#fff;border:1px solid #0f2a3a;padding:10px 16px;border-radius:10px;z-index:1000;font-size:14px;display:none;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.7}
.pin{border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(15,42,58,.45)}
.pin.pulse{position:relative}
.pin.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--pc);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.pulse,.pin.pulse::after{animation:none}.gauge i,.sheet{transition:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 9 14h5l-3 9 10-13h-5l3-7z" fill="#e5a800"/><path d="M2 24c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 4-2v6H2z" fill="#0a84b8"/></svg>
    <div>FloodEye<small>น้ำท่วมสถานีไฟฟ้า กฟน.</small></div>
  </div>
  <div class="sp"></div>
  <div class="updated" id="updated">กำลังโหลด…</div>
  <button class="btn sm" id="authBtn">เข้าสู่ระบบ</button>
</header>

<main>
  <section class="view on" id="v-map"><div id="map"></div><div class="strip" id="strip"></div></section>
  <section class="view" id="v-list"><div class="pad" style="max-width:1200px">
    <div class="ltool"><input type="search" id="lq" placeholder="ค้นหาชื่อสถานี…" aria-label="ค้นหาสถานี"><select id="lsort" aria-label="เรียงตาม"><option value="score">เรียงตามความเสี่ยง</option><option value="rain">เรียงตามฝน</option><option value="reports">เรียงตามจุดแจ้งน้ำท่วม</option><option value="name">เรียงตามชื่อ</option></select></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div></section>
  <section class="view" id="v-report"><div class="pad" id="report"></div></section>
  <section class="view" id="v-guide"><div class="pad guide" id="guide"></div></section>
  <section class="view" id="v-settings"><div class="pad" id="settings"></div></section>
</main>

<nav>
  <button class="on" data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>แผนที่</button>
  <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>สถานี</button>
  <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3"/></svg>รายงาน</button>
  <button data-v="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16M9 7h6"/></svg>คู่มือ</button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>ตั้งค่า</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ CONFIG ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA9duN7uzwd8LHZuhFj5LBcKSx5k06C-a8",
  authDomain: "motoreye-b8829.firebaseapp.com",
  projectId: "motoreye-b8829",
  storageBucket: "motoreye-b8829.firebasestorage.app",
  messagingSenderId: "1055859740152",
  appId: "1:1055859740152:web:0fc2aa85b098ddaac89a0d"
};
const DEFAULT_WEBHOOK = "https://n8n.hanuman.sbs/webhook";
const CONFIRM_TTL_H = 12;
const SETTINGS_PW_HASH = "6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493"; // SHA-256 ของรหัสแท็บตั้งค่า   // รายงาน กฟน. มีผลกี่ชั่วโมง

const LEVELS = [
  {name:"ปกติ",       color:"var(--l0)", hex:"#1f9d63"},
  {name:"เฝ้าระวัง",   color:"var(--l1)", hex:"#d9a400"},
  {name:"เสี่ยงสูง",   color:"var(--l2)", hex:"#ea6a12"},
  {name:"วิกฤต",      color:"var(--l3)", hex:"#e03347"},
  {name:"น้ำท่วมขัง",  color:"var(--l4)", hex:"#d4145a"},
];
const NODATA = {name:"ไม่มีข้อมูล", color:"var(--lx)", hex:"#1a1a1a"};
const ACCESS = {
  normal:{t:"เข้าได้ปกติ"}, high_vehicle:{t:"รถยกสูงเข้าได้"},
  no_access:{t:"เข้าไม่ได้"}, unknown:{t:"ไม่ทราบ"}
};
const TYPE = {terminal:"สถานีต้นทาง", sub:"สถานีย่อย"};

/* สถานีจากรายงาน กฟน. 26 ก.ย. 2569 — พิกัดจาก Google Maps */
const SEED = [
  {id:"nongchok", name:"หนองจอก", type:"terminal", lat:13.814339, lng:100.802980, approx:false},
  {id:"khlongroi", name:"คลองร้อย", type:"sub", lat:13.555107, lng:100.773559, approx:false},
  {id:"donmueang", name:"ดอนเมือง", type:"sub", lat:13.882433, lng:100.585367, approx:false},
  {id:"ramkhamhaeng", name:"รามคำแหง", type:"sub", lat:13.758146, lng:100.627451, approx:false},
  {id:"nana", name:"นานา", type:"sub", lat:13.750147, lng:100.555194, approx:false},
  {id:"bangphli", name:"บางพลี", type:"terminal", lat:13.640355, lng:100.689646, approx:false},
];

/* ============ STATE ============ */
// ใช้ app ชื่อ "floodeye" แยก session login ออกจาก MotorEye (โปรเจกต์/โดเมนเดียวกัน)
const fbApp = firebase.initializeApp(firebaseConfig, "floodeye");
const db = fbApp.firestore();
const auth = fbApp.auth();
let user = null, stations = [], reports = [], filter = "all", openId = null;
let demo = localStorage.getItem("fe_demo") === "1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const webhook = () => (localStorage.getItem("fe_webhook") || DEFAULT_WEBHOOK).replace(/\/$/, "");
const hoursAgo = iso => iso ? (Date.now() - new Date(iso).getTime()) / 36e5 : Infinity;
function thTime(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}) + " น.";
}
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",ms); }

/* ============ LEVEL LOGIC ============ */
function riskOf(s){
  if(s.risk && s.risk.score != null) return s.risk;
  if(!demo) return null;
  // โหมดตัวอย่าง: ค่าจำลองคงที่ต่อสถานี
  let h = 0; for(const c of s.id) h = (h*31 + c.charCodeAt(0)) % 997;
  const rain = (h % 120), wl = 40 + (h % 60), traffy = h % 5;
  const score = Math.min(100, Math.round(rain*0.3 + Math.max(0,wl-60)*0.8 + traffy*8));
  return {score, level:scoreToLevel(score), rain24h:rain, wlPercent:wl, wlStation:"(จำลอง)", traffyCount:traffy, demo:true};
}
const isNoData = r => !!r && (r.noData || (r.rain24h == null && r.wlPercent == null && !r.traffyCount && !r.longdoCount));
function scoreToLevel(sc){ return sc>=75?3 : sc>=50?2 : sc>=25?1 : 0; }
function isConfirmed(s){ return s.confirmed && s.confirmed.flooded && hoursAgo(s.confirmed.reportAt) < CONFIRM_TTL_H; }
function levelOf(s){
  if(isConfirmed(s)) return 4;
  const r = riskOf(s); return r && !isNoData(r) ? r.level : -1;
}
const LV = lv => lv < 0 ? NODATA : LEVELS[lv];
function gaugePct(s){ const lv=levelOf(s); if(lv===4) return 100; const r=riskOf(s); return r ? Math.max(4, r.score) : 0; }
function accessOf(s){
  const a = s.access, c = s.confirmed;
  if(a && c && c.accessAt && new Date(c.accessAt) > new Date(a.at || 0)) return {status:c.access, note:c.accessNote, at:c.accessAt, by:"รายงาน กฟน."};
  if(a) return a;
  if(c && c.access) return {status:c.access, note:c.accessNote, at:c.accessAt, by:"รายงาน กฟน."};
  return null;
}

/* ============ MAP ============ */
const map = L_init();
function L_init(){
  const m = window.L.map("map",{zoomControl:false,attributionControl:true}).setView([13.76,100.62],10);
  window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19}).addTo(m);
  window.L.control.zoom({position:"bottomright"}).addTo(m);
  return m;
}
let markers = {}, radiusLayer = null;
let hiddenLv = new Set(JSON.parse(localStorage.getItem("fe_hidden") || "[]"));
const BASE_SIZE = {"-1":8, 0:8, 1:10, 2:12, 3:14, 4:14};
function pinScale(){ const z = map.getZoom(); return z >= 14 ? 1.7 : z >= 13 ? 1.45 : z >= 12 ? 1.2 : 1; }
function drawMap(){
  Object.values(markers).forEach(mk => mk.remove()); markers = {};
  const pts = [], k = pinScale();
  for(const s of stations){
    if(s.lat == null || s.lng == null) continue;
    pts.push([s.lat,s.lng]);
    const lv = levelOf(s); if(hiddenLv.has(lv)) continue;
    const c = LV(lv).hex, size = Math.round(BASE_SIZE[lv] * k);
    const icon = window.L.divIcon({className:"", iconSize:[size,size],
      html:`<div class="pin ${lv>=3?"pulse":""}" style="width:${size}px;height:${size}px;background:${c};--pc:${c}"></div>`});
    const mk = window.L.marker([s.lat,s.lng],{icon, zIndexOffset:(lv+1)*1000}).addTo(map);
    const r = riskOf(s), lvl = LV(lv);
    mk.bindTooltip(`<div class="tip"><b>${esc(TYPE[s.type]||"สถานี")}${esc(s.name)}</b>
      <div><span class="lvl" style="background:${lvl.hex}">${lvl.name}</span>${r&&!isNoData(r)&&lv<4?` คะแนน ${r.score}`:""}</div>

let listQ = "", listSort = "score";
function drawList(){
  const cnt = {"-1":0,0:0,1:0,2:0,3:0,4:0}; stations.forEach(s => cnt[levelOf(s)]++);
  const lvChip = lv => { const I = LV(lv); return [String(lv), `<span class="dot" style="display:inline-block;background:${I.hex}"></span>${I.name}<span class="n">${cnt[lv]+(lv===3?cnt[4]:0)}</span>`]; };
  const fs = [["all",`ทั้งหมด<span class="n">${stations.length}</span>`], lvChip(3), lvChip(2), lvChip(1), lvChip(0), lvChip(-1)];
  const nopin = stations.filter(s => s.lat == null).length;
  if(nopin) fs.push(["nopin",`ยังไม่ปักหมุด<span class="n">${nopin}</span>`]);
  if(!fs.some(([k]) => k === filter)) filter = "all";
  $("#filters").innerHTML = fs.map(([k,t]) => `<button data-f="${k}" class="${filter===k?"on":""}">${t}</button>`).join("")
    + (stations.length ? `<button data-f="__export" style="margin-left:auto">ส่งออก CSV</button>` : "");
  if(!stations.length){
    $("#list").innerHTML = `<div class="empty">ยังไม่มีสถานีในระบบ<br><button class="btn pri" style="margin-top:12px" onclick="seedStations()">นำเข้า 6 สถานีจากรายงาน กฟน. 26 ก.ย. 69</button></div>`;
    return;
  }
  let arr = stations.slice();
  if(filter === "nopin") arr = arr.filter(s => s.lat == null);
  else if(filter !== "all"){ const f = +filter; arr = arr.filter(s => { const lv = levelOf(s); return f===3 ? lv>=3 : lv===f; }); }
  const q = listQ.trim().replace(/^สถานี(ต้นทาง|ย่อย)?/,"");
  if(q) arr = arr.filter(s => String(s.name).includes(q));
  const sc = s => riskOf(s)?.score || 0, rn = s => riskOf(s)?.rain24h ?? -1, rp = s => { const r = riskOf(s); return r ? (r.traffyCount||0)+(r.longdoCount||0) : 0; };
  const byName = (a,b) => String(a.name).localeCompare(String(b.name),"th");
  const sorters = {
    score: (a,b) => (levelOf(b)-levelOf(a)) || (sc(b)-sc(a)) || byName(a,b),
    rain: (a,b) => (rn(b)-rn(a)) || byName(a,b),
    reports: (a,b) => (rp(b)-rp(a)) || (sc(b)-sc(a)) || byName(a,b),
    name: byName };
  arr.sort(sorters[listSort] || sorters.score);
  if(!arr.length){ $("#list").innerHTML = `<div class="empty">ไม่พบสถานี${q?`ที่ชื่อมี "${esc(q)}"`:"ในกลุ่มนี้"}</div>`; return; }
  $("#list").innerHTML = `<div class="lgrid">` + arr.map(s => {
    const lv = levelOf(s), lvl = LV(lv), r = riskOf(s), a = accessOf(s), nd = !r || isNoData(r);
    const mt = [];
    if(nd) mt.push(r ? "ไม่มีสถานีวัดในรัศมี 15 กม." : "รอข้อมูลจาก n8n");
    else {
      mt.push(`ฝน <b>${r.rain24h ?? "-"}</b> มม.`);
      if(r.wlPercent != null) mt.push(`น้ำคลอง <b>${Math.round(r.wlPercent)}%</b>`);
      const n = rp(s); if(n) mt.push(`แจ้งน้ำท่วม <b>${n}</b> จุด`);
    }
    if(s.lat == null) mt.push("ยังไม่ปักหมุด");
    const acc = a && a.status && a.status!=="unknown" ? `<span class="acc ${a.status==="no_access"?"no":""}">${ACCESS[a.status]?.t}</span>` : "";
    return `<button class="srow" style="--c:${lvl.hex}" onclick="openSheet('${esc(s.id)}')">
      <span class="bd"><span class="nm">${esc(s.name)}</span><span class="tp">${esc(TYPE[s.type]||"")}</span> ${acc}
        <span class="mt">${mt.map(x=>`<span>${x}</span>`).join("")}</span></span>
      <span class="sc"><b>${nd?"–":(r?.score ?? "–")}</b><span>${lvl.name}</span></span>
    </button>`;
  }).join("") + `</div>`;
}

async function setAccess(id, status){
  if(!user) return toast("เข้าสู่ระบบก่อน");
  try{
    await db.collection("flood_stations").doc(id).set({access:{status, at:new Date().toISOString(), by:user.displayName||user.email}},{merge:true});
    toast("บันทึกสถานะการเข้าถึงแล้ว");
  }catch(e){ toast("บันทึกไม่สำเร็จ: "+e.message); }
}
async function saveName(id){
  if(!user) return toast("เข้าสู่ระบบก่อน");
  const name = $("#eName").value.trim().replace(/^สถานี(ไฟฟ้า)?(ต้นทาง|ย่อย)?/,"").trim();
  if(!name) return toast("ใส่ชื่อสถานี");
  if(stations.some(x => x.id!==id && x.name===name)) return toast("มีสถานีชื่อนี้อยู่แล้ว");
  try{ await db.collection("flood_stations").doc(id).set({name, type:$("#eType").value},{merge:true}); toast("บันทึกชื่อแล้ว"); }
  catch(e){ toast("บันทึกไม่สำเร็จ: "+e.message); }
}
async function deleteStation(id){
  if(!user) return toast("เข้าสู่ระบบก่อน");
  const s = stations.find(x => x.id === id); if(!s) return;
  if(!confirm(`ลบ${TYPE[s.type]||"สถานี"}${s.name} ออกจากระบบ?\nข้อมูลคะแนนและสถานะของสถานีนี้จะหายไปด้วย`)) return;
  try{ await db.collection("flood_stations").doc(id).delete(); closeSheet(); toast(`ลบสถานี${s.name}แล้ว`); }
  catch(e){ toast("ลบไม่สำเร็จ: "+e.message); }
}
function useGPS(){
  if(!navigator.geolocation) return toast("อุปกรณ์นี้ไม่รองรับตำแหน่ง");
  navigator.geolocation.getCurrentPosition(p => { $("#eLat").value=p.coords.latitude.toFixed(6); $("#eLng").value=p.coords.longitude.toFixed(6); toast("ได้ตำแหน่งแล้ว กดบันทึกพิกัด"); },
    e => toast("อ่านตำแหน่งไม่ได้: "+e.message), {enableHighAccuracy:true, timeout:10000});
}
async function saveCoords(id){
  const lat = parseFloat($("#eLat").value), lng = parseFloat($("#eLng").value);
  if(!(lat>5 && lat<21 && lng>97 && lng<106)) return toast("พิกัดไม่อยู่ในประเทศไทย ตรวจตัวเลขอีกครั้ง");
  try{ await db.collection("flood_stations").doc(id).set({lat,lng,approx:false},{merge:true}); drawMap._fit=false; toast("บันทึกพิกัดแล้ว"); }
  catch(e){ toast("บันทึกไม่สำเร็จ: "+e.message); }
}

/* ============ REPORT ============ */
let pendingImg = null;
function drawReport(){
  const groups = {3:[],2:[],1:[],0:[],"-1":[]};
  stations.forEach(s => { const lv = levelOf(s); (groups[lv] || groups[3]).push(s); });
  Object.values(groups).forEach(g => g.sort((a,b)=>((riskOf(b)?.score||0)-(riskOf(a)?.score||0)) || String(a.name).localeCompare(String(b.name),"th")));
  const order = [3,2,1,0,-1], info = lv => lv<0 ? NODATA : LEVELS[lv];
  const row = s => { const r = riskOf(s), a = accessOf(s), nd = !r || isNoData(r);
    const bits = nd ? ["ไม่มีสถานีวัดใกล้"] : [`คะแนน ${r.score}`, `ฝน ${r.rain24h ?? "-"} มม.`];
    if(!nd && r.wlPercent != null) bits.push(`น้ำคลอง ${Math.round(r.wlPercent)}%`);
    const rc = r ? (r.traffyCount||0)+(r.longdoCount||0) : 0; if(rc) bits.push(`แจ้งน้ำท่วม ${rc} จุด`);
    if(a && a.status && a.status!=="unknown") bits.push(ACCESS[a.status]?.t);
    return `<li><a href="#" onclick="openSheet('${esc(s.id)}');return false" style="color:inherit">${esc(TYPE[s.type]||"")}${esc(s.name)}</a> <span class="note">· ${bits.map(esc).join(" · ")}</span></li>`; };
  $("#report").innerHTML = `
    <div class="rep-head"><h2>สถานการณ์น้ำท่วมสถานีไฟฟ้า</h2>
      <div class="note">ณ ${thTime(new Date().toISOString())} · ทั้งหมด ${stations.length} สถานี</div>
      <div class="rep-grid">${order.map(lv=>`<div><b style="color:${info(lv).hex}">${groups[lv].length}</b><span>${info(lv).name}</span></div>`).join("")}</div>
    </div>
    ${order.filter(lv => groups[lv].length).map(lv => `
      <details class="card" ${lv>=2?"open":""}>
        <summary style="cursor:pointer;font-weight:600;font-size:16px"><span class="dot" style="display:inline-block;background:${info(lv).hex};margin-right:6px"></span>${info(lv).name} (${groups[lv].length})</summary>
        <ul style="margin-top:8px">${groups[lv].map(row).join("")}</ul>
      </details>`).join("")}`;
}
function loadImage(file){
  if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    pendingImg = cv.toDataURL("image/jpeg", 0.85); URL.revokeObjectURL(url); drawReport();
  };
  img.src = url;
}
async function readInfographic(){
  const btn = $("#readBtn"), out = $("#readOut");
  btn.disabled = true; btn.textContent = "กำลังอ่านภาพ… (ประมาณ 10–30 วินาที)";
  try{
    const res = await fetch(webhook() + "/floodeye-infographic", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({image: pendingImg.split(",")[1], mediaType:"image/jpeg", by: user.displayName || user.email})
    });
    const j = await res.json();
    if(!res.ok || j.ok === false) throw new Error(j.error || ("HTTP "+res.status));
    out.textContent = `อ่านได้ ${j.flooded?.length||0} สถานีที่น้ำท่วมขัง: ${(j.flooded||[]).join(", ")}` + (j.unmatched?.length?`\nสถานีใหม่ที่ต้องปักหมุด: ${j.unmatched.join(", ")}`:"");
    pendingImg = null; toast("อัปเดตจากรายงาน กฟน. แล้ว");
    setTimeout(drawReport, 1500);
  }catch(e){
    out.textContent = "อ่านไม่สำเร็จ: " + e.message + "\nตรวจว่า workflow FloodEye — MEA Infographic Reader เปิด Active อยู่ และ URL webhook ในหน้าตั้งค่าถูกต้อง";
    btn.disabled = false; btn.textContent = "ลองอีกครั้ง";
  }
}

/* ============ IMPORT ============ */
let impRows = [];
const EXCL_OP = /กฟผ|EGAT|Generating|กฟภ|PEA|Provincial/i;
const EXCL_SUB = /^(minor_distribution|industrial|traction|converter)$/i;
const normName = n => String(n||"").replace(/\*+/g," ").replace(/การไฟฟ้านครหลวง|กฟน\.?|\bMEA\b|สถานีไฟฟ้าย่อย|สถานีไฟฟ้าต้นทาง|สถานีไฟฟ้า|สถานีย่อย|สถานีต้นทาง|substation|สถานี/gi,"").replace(/[()]/g," ").replace(/\s+/g," ").trim();
const keyName = n => normName(n).replace(/\s/g,"").toLowerCase();
function centroid(g){
  const pts=[]; (function walk(c){ if(typeof c[0]==="number") pts.push(c); else c.forEach(walk); })(g.coordinates||[]);
  if(!pts.length) return {};
  return {lng: pts.reduce((a,p)=>a+p[0],0)/pts.length, lat: pts.reduce((a,p)=>a+p[1],0)/pts.length};
}
function splitCSV(l){ const out=[]; let cur="", q=false;
  for(let i=0;i<l.length;i++){ const ch=l[i];
    if(q){ if(ch==='"'){ if(l[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===","){ out.push(cur); cur=""; } else cur+=ch; }
  out.push(cur); return out; }
function parseCSV(text){
  const lines = text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  const head = splitCSV(lines.shift()).map(h=>h.trim().toLowerCase());
  const col = names => head.findIndex(h => names.includes(h));
  const iId=col(["id"]), iN=col(["name","ชื่อ","ชื่อสถานี"]), iT=col(["type","ประเภท"]), iLa=col(["lat","latitude","ละติจูด"]), iLo=col(["lng","lon","long","longitude","ลองจิจูด"]);
  return lines.map(l => { const c=splitCSV(l).map(x=>x.trim()); const t=(c[iT]||"");
    return {id: iId>=0 ? c[iId] : null, tags:{name:c[iN]}, lat:parseFloat(c[iLa]), lng:parseFloat(c[iLo]), forceType: /ต้นทาง|terminal/i.test(t)?"terminal":(t?"sub":null)}; });
}
function parseStationFile(text, fname){
  let raw = [];
  if(/\.csv$/i.test(fname)) raw = parseCSV(text);
  else {
    const j = JSON.parse(text);
    if(j.elements) raw = j.elements.map(e => ({tags:e.tags||{}, lat:e.lat ?? e.center?.lat, lng:e.lon ?? e.center?.lon}));
    else if(j.features) raw = j.features.map(f => { const p=f.properties||{}; return {tags: p.tags||p, ...(f.geometry?.type==="Point"?{lng:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}:centroid(f.geometry||{}))}; });
  }
  const upd = !!$("#impUpdate")?.checked;
  const byKey = new Map(stations.map(s => [keyName(s.name), s])), byId = new Map(stations.map(s => [s.id, s]));
  const seen = new Set(), out = [], skip = {noname:0, other:0, dup:0, nopos:0};
  for(const r of raw){
    const t = r.tags||{}, name = t["name:th"] || t.name || t["name:en"] || "";
    if(!name){ skip.noname++; continue; }
    if(EXCL_OP.test((t.operator||"")+" "+name) || EXCL_SUB.test(t.substation||"")){ skip.other++; continue; }
    if(!(r.lat>5 && r.lat<21 && r.lng>97 && r.lng<106)){ skip.nopos++; continue; }
    const k = keyName(name); if(!k || seen.has(k)){ skip.dup++; continue; }
    const type = r.forceType || (/ต้นทาง|terminal/i.test(name) || /transmission/i.test(t.substation||"") ? "terminal" : "sub");
    const exist = (r.id && byId.get(r.id)) || byKey.get(k);
    if(exist && !upd){ skip.dup++; continue; }
    seen.add(k);
    out.push({id: exist ? exist.id : normName(name).replace(/[^\w\u0E00-\u0E7F]/g,"_"), update: !!exist, name: normName(name), type, lat:+r.lat.toFixed(6), lng:+r.lng.toFixed(6), source: t.operator||""});
  }
  return {out, skip, total: raw.length};
}
function onImpFile(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const {out, skip, total} = parseStationFile(rd.result, file.name); impRows = out;
      $("#impPreview").innerHTML = `<p class="note" style="margin-top:10px">อ่านได้ ${total} รายการ · นำเข้าได้ <b>${out.length}</b> · ข้าม: ไม่มีชื่อ ${skip.noname}, ของหน่วยงานอื่น/ไม่ใช่สถานีจำหน่าย ${skip.other}, ซ้ำ ${skip.dup}, พิกัดผิด ${skip.nopos}</p>
        ${out.length?`<div class="gt-wrap" style="max-height:260px;overflow:auto"><table class="gt"><thead><tr><th>ชื่อ</th><th>ประเภท</th><th>พิกัด</th><th></th></tr></thead><tbody>${out.map(r=>`<tr><td>${esc(r.name)}</td><td>${TYPE[r.type]}</td><td>${r.lat}, ${r.lng}</td><td>${r.update?"อัปเดต":"ใหม่"}</td></tr>`).join("")}</tbody></table></div>
        <button class="btn pri" style="width:100%;margin-top:10px" onclick="commitImport()">บันทึก ${out.length} สถานี (ใหม่ ${out.filter(r=>!r.update).length} · อัปเดต ${out.filter(r=>r.update).length})</button>`:""}`;
    }catch(e){ $("#impPreview").innerHTML = `<p class="note" style="color:var(--l3)">อ่านไฟล์ไม่ได้: ${esc(e.message)}</p>`; }
  };
  rd.readAsText(file);
}
async function commitImport(){
  if(!user || !impRows.length) return;
  const now = new Date().toISOString();
  try{
    for(let i=0;i<impRows.length;i+=400){
      const b = db.batch();
      impRows.slice(i,i+400).forEach(r => b.set(db.collection("flood_stations").doc(r.id),
        r.update ? {name:r.name, type:r.type, lat:r.lat, lng:r.lng, approx:false} : {name:r.name, type:r.type, lat:r.lat, lng:r.lng, approx:false, source:"import", createdAt:now}, {merge:true}));
      await b.commit();
    }
    toast(`บันทึก ${impRows.length} สถานีแล้ว`); impRows = []; drawMap._fit = false; $("#impPreview").innerHTML = "";
  }catch(e){ toast("นำเข้าไม่สำเร็จ: "+e.message); }
}
async function purgeNoName(){
  const list = stations.filter(s => s._noname && s.lat == null); if(!list.length) return;
  if(!confirm(`ลบ ${list.length} รายการที่ไม่มีชื่อ?`)) return;
  try{ for(let i=0;i<list.length;i+=400){ const b=db.batch(); list.slice(i,i+400).forEach(s=>b.delete(db.collection("flood_stations").doc(s.id))); await b.commit(); }
    toast(`ลบ ${list.length} รายการแล้ว`); }
  catch(e){ toast("ลบไม่สำเร็จ: "+e.message); }
}
function exportStations(){
  const q = v => { v = v==null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows = [["id","name","type","lat","lng","level","score","rain24h_mm","google_maps"]];
  stations.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"th")).forEach(s => {
    const r = riskOf(s), lv = levelOf(s);
    rows.push([s.id, s.name, s.type==="terminal"?"ต้นทาง":"ย่อย", s.lat ?? "", s.lng ?? "", lv<0?"":LV(lv).name, r?.score ?? "", r?.rain24h ?? "",
      s.lat!=null ? `https://www.google.com/maps?q=${s.lat},${s.lng}` : ""]);
  });
  const blob = new Blob(["\uFEFF" + rows.map(r => r.map(q).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `floodeye-stations-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`ส่งออก ${stations.length} สถานีแล้ว ดูไฟล์ในโฟลเดอร์ Downloads`);
}
function toggleDemo(){ demo=!demo; localStorage.setItem("fe_demo",demo?"1":"0"); renderAll(); }
async function addStation(){
  const name = $("#nName").value.trim().replace(/^สถานี(ต้นทาง|ย่อย)?/,"").trim();
  if(!name) return toast("ใส่ชื่อสถานี");
  const lat = parseFloat($("#nLat").value), lng = parseFloat($("#nLng").value);
  const id = name.replace(/[^\w\u0E00-\u0E7F]/g,"_");
  if(stations.some(s=>s.id===id)) return toast("มีสถานีนี้อยู่แล้ว");
  try{
    await db.collection("flood_stations").doc(id).set({name, type:$("#nType").value, lat:isNaN(lat)?null:lat, lng:isNaN(lng)?null:lng, approx:false, createdAt:new Date().toISOString()});
    toast("เพิ่มสถานี"+name+"แล้ว");
  }catch(e){ toast("เพิ่มไม่สำเร็จ: "+e.message); }
}
async function seedStations(){
  if(!user) return toast("เข้าสู่ระบบก่อน");
  const b = db.batch();
  SEED.forEach(s => b.set(db.collection("flood_stations").doc(s.id), {name:s.name,type:s.type,lat:s.lat,lng:s.lng,approx:s.approx,createdAt:new Date().toISOString()},{merge:true}));
  try{ await b.commit(); toast("นำเข้า 6 สถานีแล้ว แก้พิกัดให้ตรงหน้างานด้วย"); }catch(e){ toast("นำเข้าไม่สำเร็จ: "+e.message); }
}

/* ============ NAV / AUTH / DATA ============ */
async function sha256(t){ const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function askSettingsPw(){
  return new Promise(res => {
    $("#sheet").innerHTML = `<div class="grab"></div><h2>ใส่รหัสผ่าน</h2>
      <p class="note">แท็บตั้งค่าต้องใช้รหัสผ่าน</p>
      <input type="password" id="pwIn" inputmode="numeric" autocomplete="off" placeholder="รหัสผ่าน">
      <div class="seg" style="margin-top:10px"><button id="pwCancel">ยกเลิก</button><button id="pwOk" class="on">เข้าสู่ตั้งค่า</button></div>
      <p class="note" id="pwErr" style="color:var(--l3)"></p>`;
    $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on"); setTimeout(()=>$("#pwIn").focus(),50);
    const done = ok => { $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); res(ok); };
    const check = async () => {
      if(await sha256($("#pwIn").value) === SETTINGS_PW_HASH){ sessionStorage.setItem("fe_settings_ok","1"); done(true); }
      else { $("#pwErr").textContent = "รหัสผ่านไม่ถูกต้อง"; $("#pwIn").select(); }
    };
    $("#pwOk").onclick = check; $("#pwCancel").onclick = () => done(false);
    $("#pwIn").onkeydown = e => { if(e.key==="Enter") check(); };
  });
}
document.querySelector("nav").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.v==="settings" && sessionStorage.getItem("fe_settings_ok")!=="1" && !(await askSettingsPw())) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x===b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-"+b.dataset.v));
  if(b.dataset.v==="map") setTimeout(()=>map.invalidateSize(),50);
});
$("#authBtn").onclick = async () => {
  if(user) return auth.signOut();
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ toast("เข้าสู่ระบบไม่สำเร็จ: "+e.message); }
};
auth.onAuthStateChanged(u => { user = u; $("#authBtn").textContent = u ? "ออกจากระบบ" : "เข้าสู่ระบบ"; renderAll(); });

function renderAll(){
  drawMap(); drawList(); drawReport(); drawGuide(); drawSettings(); if(openId) drawSheet();
  const latest = stations.map(s=>s.risk?.updatedAt).filter(Boolean).sort().pop();
  $("#updated").innerHTML = latest ? `ประเมินล่าสุด<br>${thTime(latest)}` : (demo ? "โหมดตัวอย่าง" : "รอข้อมูลจาก n8n");
}
db.collection("flood_stations").onSnapshot(snap => {
  stations = snap.docs.map(d => ({id:d.id, ...d.data()})).map(s => ({...s, _noname: !s.name, name: s.name || `(ไม่มีชื่อ: ${decodeURIComponent(s.id)})`})); renderAll();
}, e => { $("#updated").textContent = "เชื่อมฐานข้อมูลไม่ได้"; toast(e.message); });
db.collection("flood_reports").orderBy("receivedAt","desc").limit(5).onSnapshot(snap => {
  reports = snap.docs.map(d => d.data()).filter(r => r.valid !== false); drawReport();
}, () => {});

if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
